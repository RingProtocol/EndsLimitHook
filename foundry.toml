[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 64

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"

[profile.script]
via_ir = true
optimizer = true
optimizer_runs = 200

[lint]
lint_on_build = false
